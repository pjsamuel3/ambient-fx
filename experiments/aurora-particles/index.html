<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora Particles — ambient-fx</title>
  <link rel="stylesheet" href="../../shared/ui/panel.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Background layer: the engine mounts on this canvas. -->
  <div class="aurora-bg" aria-hidden="true">
    <canvas id="aurora"></canvas>
  </div>

  <!-- Foreground content sits above the canvas and remains fully interactive. -->
  <main class="hero">
    <p class="eyebrow">ambient-fx / aurora-particles · <a href="../flowing-gradient/">gradient version →</a></p>
    <h1>A living lattice of light.</h1>
    <p class="lede">
      Coherent noise drives slow aurora bands through an evenly spaced particle grid.
      Move the pointer to send ripples through the field. Click to drop a stone.
    </p>
    <div class="actions">
      <a class="btn primary" href="#" id="cta">Get started</a>
      <a class="btn ghost" href="./README.md">How it works</a>
    </div>
  </main>

  <!-- Control panel, kept outside the rendering area. -->
  <aside class="panel" id="panel" aria-label="Aurora configuration">
    <header class="panel-head">
      <button class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
        <span class="chev" aria-hidden="true"></span>
        <span>Aurora controls</span>
      </button>
      <span class="fps" title="Frames per second">— fps</span>
    </header>
    <div class="panel-body" id="panel-body">
      <div class="controls"></div>
      <div class="panel-actions">
        <button class="btn small" data-action="pause">Pause</button>
        <button class="btn small ghost" data-action="reset">Reset to defaults</button>
      </div>
    </div>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>
