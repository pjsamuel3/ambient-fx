<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowing Gradient — ambient-fx</title>
  <link rel="stylesheet" href="../../shared/ui/panel.css" />
  <link rel="stylesheet" href="../../shared/ui/nav.css" />
  <link rel="stylesheet" href="../../shared/ui/content.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="gradient-bg" aria-hidden="true">
    <canvas id="gradient"></canvas>
  </div>

  <main class="hero">
    <p class="eyebrow">ambient-fx / flowing-gradient</p>
    <h1>Soft light, slowly moving.</h1>
    <p class="lede">
      The same aurora field rendered as smooth pastel washes. Move the pointer to
      send gentle waves through the colour; click to drop a stone.
    </p>
    <div class="actions">
      <a class="btn primary" href="#" id="cta">Get started</a>
      <a class="btn ghost" href="./README.md">How it works</a>
    </div>
  </main>

  <aside class="panel light" id="panel" aria-label="Gradient configuration">
    <header class="panel-head">
      <button class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
        <span class="chev" aria-hidden="true"></span>
        <span>Gradient controls</span>
      </button>
      <span class="fps" title="Frames per second">— fps</span>
    </header>
    <div class="panel-body" id="panel-body">
      <div class="controls"></div>
      <div class="panel-actions">
        <button class="btn small" data-action="pause">Pause</button>
        <button class="btn small ghost" data-action="reset">Reset to defaults</button>
      </div>
    </div>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>
